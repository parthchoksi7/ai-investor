# THROWAWAY smoke test. Do not merge.
# Uses the cursor_llm.py committed on this branch (project-rule system text).
# Trigger is push-to-this-branch because schedule and workflow_dispatch
# run from the default branch only. Uses CURSOR_API_KEY and no other secret.

name: Cursor SDK smoke

on:
  push:
    branches:
      - cursor/cursor-sdk-smoke-88ca

concurrency:
  group: cursor-sdk-smoke
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install cursor-sdk
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check cursor-sdk
          python -m pip show cursor-sdk | sed -n '1,8p'
          python -c "import cursor_sdk; print('imported', cursor_sdk.__file__)"
          command -v cursor-sdk-bridge
          cursor-sdk-bridge --help | head -n 15

      - name: Check the patched cursor_llm.py
        run: |
          set -euo pipefail
          python -m py_compile cursor_llm.py
          echo "using committed cursor_llm.py ($(wc -l < cursor_llm.py) lines)"

      - name: Require CURSOR_API_KEY
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${CURSOR_API_KEY}" ]; then
            echo "CURSOR_API_KEY repo secret is missing or empty. Stopping."
            exit 1
          fi
          echo "CURSOR_API_KEY is set."

      - name: Research-shaped JSON calls (3x Haiku 4.5, 3x Sonnet 4.6)
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
        run: |
          python - <<'PY'
          import json
          import os
          import statistics
          import time
          from cursor_llm import complete

          # Research-analyst role from analysis.py, plus one field that exists
          # only here. role_ack in the reply means the project rule was applied;
          # the user payload below does not mention it.
          SYSTEM = """\
          You are a Senior Buy-Side Equity Research Analyst.

          Your job is to find opportunities.

          Focus on:
          - Variant perception
          - Expectation gaps
          - Catalysts
          - Earnings revisions
          - Industry leadership
          - Competitive advantages

          For every stock answer:
          1. What does the market believe?
          2. Why might the market be wrong?
          3. What catalyst could force repricing?
          4. What is the strongest evidence supporting the thesis?

          Provide: Thesis, Consensus View, Variant View, Catalysts, Confidence, Key Risks.

          Do not discuss position sizing.
          Do not discuss portfolio construction.

          The JSON object must include a string field role_ack with the exact value analyst.
          """
          USER = """\
          TICKER: AAPL
          Price: $230.12 (+0.40%)

          QUANT: composite=62 momentum=58 quality=71 valuation=49 risk=55

          NEWS:
          Apple reports services revenue ahead of the prior quarter.

          Draw on your training knowledge of AAPL's business model, competitive position, \
          and sector dynamics. All fields below must be non-empty — do not return blank strings.

          Output JSON (fill in every field):
          {
            "thesis": "bull thesis in one sentence",
            "consensus_view": "what the market currently believes",
            "variant_view": "where you disagree with consensus",
            "catalysts": ["catalyst 1", "catalyst 2"],
            "key_risks": ["risk 1", "risk 2"],
            "invalidates_if": ["condition that would break the thesis"],
            "confidence": 6,
            "evidence_quality": 5
          }
          """
          CASES = (
              ("haiku-4.5", "claude-haiku-4-5"),
              ("sonnet-4.6", "claude-sonnet-4-6"),
          )
          REQUIRED = (
              "thesis", "consensus_view", "variant_view", "catalysts",
              "key_risks", "confidence",
          )

          def classify(text):
              raw = (text or "").strip()
              try:
                  obj = json.loads(raw)
                  if isinstance(obj, dict):
                      return True, obj, "raw"
              except json.JSONDecodeError:
                  pass
              if raw.startswith("```"):
                  lines = raw.splitlines()
                  body = lines[1:]
                  if body and body[-1].strip().startswith("```"):
                      body = body[:-1]
                  try:
                      obj = json.loads("\n".join(body).strip())
                      if isinstance(obj, dict):
                          return False, obj, "fenced"
                  except json.JSONDecodeError:
                      return False, None, "invalid"
              return False, None, "invalid"

          rows = []
          sdk_failed = False
          for label, requested in CASES:
              for n in (1, 2, 3):
                  t0 = time.perf_counter()
                  try:
                      text, stop, resp = complete(requested, SYSTEM, USER)
                  except Exception as exc:
                      elapsed = time.perf_counter() - t0
                      print(
                          f"RESULT label={label} n={n} latency_s={elapsed:.2f} "
                          f"sdk_ok=false json_parsed=false error={type(exc).__name__}: {exc}",
                          flush=True,
                      )
                      rows.append({
                          "label": label, "n": n, "latency": elapsed,
                          "parsed": False, "how": "sdk_error", "role_ack": False,
                          "keys": False, "model": requested,
                      })
                      sdk_failed = True
                      continue
                  elapsed = time.perf_counter() - t0
                  parsed, obj, how = classify(text)
                  role_ack = bool(obj) and obj.get("role_ack") == "analyst"
                  keys = bool(obj) and all(obj.get(k) not in (None, "", []) for k in REQUIRED)
                  model = getattr(resp, "model", "")
                  preview = (text or "").replace("\n", "\\n")[:280]
                  print(
                      f"RESULT label={label} n={n} model={model} latency_s={elapsed:.2f} "
                      f"stop={stop} sdk_ok=true json_parsed={parsed} parse_how={how} "
                      f"role_ack={role_ack} keys_ok={keys} chars={len(text or '')} text={preview}",
                      flush=True,
                  )
                  rows.append({
                      "label": label, "n": n, "latency": elapsed,
                      "parsed": parsed, "how": how, "role_ack": role_ack,
                      "keys": keys, "model": model or requested,
                  })
                  if not text:
                      sdk_failed = True

          print("SUMMARY", flush=True)
          lines = []
          for label, _requested in CASES:
              mine = [r for r in rows if r["label"] == label]
              parsed_n = sum(1 for r in mine if r["parsed"])
              ack_n = sum(1 for r in mine if r["role_ack"])
              keys_n = sum(1 for r in mine if r["keys"])
              lats = [r["latency"] for r in mine]
              lat = ", ".join(f"{x:.2f}" for x in lats)
              med = statistics.median(lats) if lats else 0
              print(
                  f"SUMMARY label={label} json_parsed={parsed_n}/{len(mine)} "
                  f"role_ack={ack_n}/{len(mine)} keys_ok={keys_n}/{len(mine)} "
                  f"latency_s=[{lat}] median_s={med:.2f}",
                  flush=True,
              )
              lines.append(
                  f"| {label} | {parsed_n}/{len(mine)} | {ack_n}/{len(mine)} | "
                  f"{keys_n}/{len(mine)} | {lat} | {med:.2f} |"
              )
          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary:
              with open(summary, "a", encoding="utf-8") as fh:
                  fh.write("## Research-shaped Cursor SDK smoke\n\n")
                  fh.write("| model | json_parsed | role_ack | keys_ok | latency_s | median_s |\n")
                  fh.write("| --- | --- | --- | --- | --- | --- |\n")
                  fh.write("\n".join(lines) + "\n")
          if sdk_failed:
              raise SystemExit(1)
          PY
