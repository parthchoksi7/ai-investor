name: DST Cron Update

on:
  schedule:
    # Every Sunday 12:00 UTC (7–8 AM ET) — hours AFTER the 2 AM Sunday change and a
    # full day before Monday's first job, so the routine-cron issue lands in time
    # to act on (GH may defer a cron by hours; a Sunday slot absorbs that). The script below
    # reads the CURRENT New York offset and is a no-op when the crons already match,
    # so running weekly costs ~1 min and can never be late. Until 2026-11-05 this
    # fired on fixed dates (Mar 15 / Nov 8) that trail the real changes (second
    # Sunday of March / first Sunday of November) by up to a week: in 2026 DST
    # ended Nov 1 and every ET-pinned job ran an hour early until Nov 8.
    - cron: '0 12 * * 0'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v5

      - name: Detect UTC offset and update cron expressions
        id: dst
        run: |
          python3 - <<'EOF'
          import os
          import re
          from datetime import datetime
          from zoneinfo import ZoneInfo

          tz = ZoneInfo("America/New_York")
          offset_hours = int(datetime.now(tz).utcoffset().total_seconds() / 3600)  # -4 or -5

          # health_check.yml: 1:15 PM ET (after the last 12:45 ET routine retry)
          hc  = 13 - offset_hours

          # market_data.yml — replace the entire schedule block (1 cron) as a unit.
          # These strings MUST match market_data.yml byte-for-byte or the replace is a
          # silent no-op. That is not hypothetical: this block previously described a
          # THREE-cron 7:00/8:00/8:30 schedule that had already been replaced by a
          # four-cron one, so it matched nothing and market_data.yml would have been
          # left on the wrong offset all winter. Fixed 2026-09-21 along with the
          # four-to-two cron cut; cut to one cron 2026-10-21. The assertion below
          # now fails loudly instead.
          mkt_block_edt = (
              "    - cron: '0 12 * * 1-5'   # 8:00 AM EDT — scheduled fetch, worst-case margin before 9:45"
          )
          mkt_block_est = (
              "    - cron: '0 13 * * 1-5'   # 8:00 AM EST — scheduled fetch, worst-case margin before 9:45"
          )
          mkt_old = mkt_block_est if offset_hours == -4 else mkt_block_edt
          mkt_new = mkt_block_edt if offset_hours == -4 else mkt_block_est

          changed = False
          # Deferred so a market_data mismatch cannot abort the health_check rewrite
          # below — stranding health_check.yml on the wrong offset too would re-create
          # the Jun 12 hygiene bug (a 12:15 PM ET check false-alarming against the
          # 12:45 ET routine retry). Record the failure, finish the work that CAN be
          # done, then fail the step at the end.
          fatal = None

          path = ".github/workflows/market_data.yml"
          text = open(path).read()
          if mkt_new in text:
              print(f"{path} already on UTC{offset_hours} — nothing to do")
          elif mkt_old in text:
              open(path, "w").write(text.replace(mkt_old, mkt_new))
              changed = True
              print(f"Updated {path} for UTC{offset_hours}")
          else:
              fatal = (
                  f"::error::{path} schedule block matches NEITHER the expected EDT nor EST "
                  "form — the cron block was edited without updating update_dst.yml. "
                  "market_data.yml is now on the wrong offset for half the year; fix both files."
              )
              print(fatal)

          path = ".github/workflows/health_check.yml"
          text = open(path).read()
          # health_check fires at minute 15 (1:15 PM ET); match minute 15 explicitly
          new_text = re.sub(r"cron: '15 \d+ \* \* 1-5'", f"cron: '15 {hc} * * 1-5'", text)
          if new_text != text:
              open(path, "w").write(new_text)
              changed = True
              print(f"Updated {path} for UTC{offset_hours}")

          # shadow_cursor.yml: 1:30 PM ET Wednesday (after the live rebalance commit).
          # Same offset math as health_check: hour = 13 - offset_hours → 17 EDT / 18 EST.
          path = ".github/workflows/shadow_cursor.yml"
          if os.path.exists(path):
              text = open(path).read()
              sh = 13 - offset_hours
              new_text = re.sub(
                  r"cron: '30 \d+ \* \* 3'", f"cron: '30 {sh} * * 3'", text, count=1)
              if new_text != text:
                  open(path, "w").write(new_text)
                  changed = True
                  print(f"Updated {path} for UTC{offset_hours}")
              elif f"cron: '30 {sh} * * 3'" in text:
                  print(f"{path} already on UTC{offset_hours} — nothing to do")
              else:
                  fatal = (
                      f"::error::{path} Wednesday cron matches neither the expected "
                      "EDT nor EST form — the cron was edited without updating "
                      "update_dst.yml."
                  )
                  print(fatal)

          if not changed:
              print("No changes needed — crons already correct for current offset.")
          # The two Anthropic routines (daily cycle + EOD close) are NOT in this repo
          # and cannot be rewritten from here. Hand the owner the exact crons.
          with open(os.environ["GITHUB_OUTPUT"], "a") as _o:
              _o.write(f"changed={'true' if changed else 'false'}\n")
              _o.write(f"offset={offset_hours}\n")

          # health_check.yml has been given every chance to update before this fires.
          if fatal:
              raise SystemExit(fatal)
          EOF

      - name: Commit if changed
        # always() so that a market_data block mismatch (which fails the step above
        # AFTER rewriting health_check.yml) still commits the health_check fix. The
        # run is still reported as failed by the step above — this only stops a
        # loud failure on one file from silently discarding correct work on the other.
        if: always()
        run: |
          git config user.name "DST Bot"
          git config user.email "dst-bot@users.noreply.github.com"
          git add .github/workflows/market_data.yml .github/workflows/health_check.yml .github/workflows/shadow_cursor.yml
          git diff --staged --quiet || git commit -m "chore: DST cron update [skip ci]"
          git push

      - name: Open an issue to move the Anthropic routine crons
        # Only on the run that actually flipped the GitHub crons — i.e. the Sunday
        # of a DST change. always(): if the step above fails AFTER flipping some
        # crons (and the always() commit pushes them), the next run sees no change,
        # so this is the only chance to open the issue.
        if: always() && steps.dst.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OFFSET: ${{ steps.dst.outputs.offset }}
        run: |
          if [ "$OFFSET" = "-4" ]; then
            DAILY='45 13,14,15,16 * * 1-5'; EOD='0 20 * * 1-5'; LABEL='EDT (summer)'
          else
            DAILY='45 14,15,16,17 * * 1-5'; EOD='0 21 * * 1-5'; LABEL='EST (winter)'
          fi
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "DST changed: move the Anthropic routine crons to $LABEL" \
            --body "The GitHub Actions crons were updated for UTC${OFFSET}. The two Anthropic routines live outside this repo and must be updated by hand (claude.ai/code/routines):

          - Daily cycle: \`$DAILY\` (9:45 / 10:45 / 11:45 / 12:45 ET)
          - EOD close snapshot: \`$EOD\` (4:00 PM ET)

          Until they are moved, the morning stop check runs at the wrong hour and the EOD close_value is recorded an hour off (Nov 2–4 2026 were recorded at 3 PM)."
