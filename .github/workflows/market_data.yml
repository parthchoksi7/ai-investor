name: Market Data Fetch

on:
  schedule:
    # TWO staggered triggers (EDT = UTC-4) — GitHub silently skips scheduled runs under load,
    # so a second entry ensures one still lands before the 9:45 AM ET trading routine.
    # The 5:00 AM head start (Stage D) gives the expanded ~400-name sweep + enrichment room.
    #
    # Cut from four triggers to two on 2026-09-21: each run spends ~38 min (observed 12-70)
    # almost entirely asleep on Polygon's free-tier 5-calls/min limit, and GitHub bills that
    # idle wall-clock. Four runs/weekday = ~3,200 min/month against a 2,000-min allowance;
    # two = ~1,600. The 8:00 slot (not 8:30) is the second trigger deliberately: the binding
    # constraint is `timeout-minutes: 50` below, so the LATEST a run can possibly finish (or
    # be killed with nothing committed) is start + 50 min. From 8:00 that is 8:50, 55 min
    # before the 9:45 routine; from 8:30 it is 9:20, leaving 25. Both clear 9:45, but 8:00
    # leaves room to notice a killed run and fire the manual safety dispatch; 8:30 does not.
    # See the expansion-sweep note in the concurrency block below.
    #
    # In winter (EST = UTC-5): update to '0 10', '0 13' (update_dst.yml does this automatically)
    - cron: '0 9  * * 1-5'   # 5:00 AM EDT — early crawl (Stage D sweep + max retry buffer)
    - cron: '0 12 * * 1-5'   # 8:00 AM EDT — fallback, with worst-case margin before 9:45
  # On-demand (Oct 2026 remediation 2.4): when the routine's preflight gate finds a
  # stale snapshot on a rebalance day it exits 11 and the routine pushes
  # data_request.json. A push-triggered run starts within seconds, unlike the
  # scheduled crons, which GitHub has been starting 2-7 hours late (observed
  # 9:52 AM-3:32 PM ET for the "5:00 / 8:00 AM" triggers in Sep-Oct 2026). The
  # `check` job below makes an on-demand run a no-op when today's snapshot already
  # exists or the request is not dated today (e.g. the merge that first adds the file).
  push:
    branches: [main]
    paths: ['data_request.json']
  workflow_dispatch:
    inputs:
      full_refresh:
        description: 'Refresh all 100 tickers (bypass 50/50 alternate-day split)'
        required: false
        default: false
        type: boolean

# Serialize runs of this workflow. The staggered crons are deliberately redundant
# (GitHub silently skips scheduled runs under load), but they assume a run
# finishes before the next fires. On 2026-08-27/28 GitHub's scheduler deferred
# every trigger by ~10 hours, so all four (then-current) triggers landed 24-52 min
# apart instead of 30-120 min. Two concurrent runs then (a) shared one Polygon free-tier 5-calls/min
# budget, producing 429 storms that stretched each run from ~12-40 min to 40-70 min
# (which caused MORE overlap — self-reinforcing), and (b) both regenerated all eight
# committed artifacts, so the loser's push lost the race and its `git pull --rebase`
# hit a content conflict in every one of them, tripping the deliberate abort in the
# push step below. Three runs failed that way.
#
# cancel-in-progress: false — an in-flight sweep must never be killed mid-fetch;
# its progress (raw_history_store.json + the expansion cursor) is only durable via
# the always-run cache save below.
#
# workflow_dispatch is deliberately EXEMPT (its own per-run group). The manual
# dispatch is the documented mitigation for exactly the situation this block guards
# against — "no fresh snapshot has landed and the routine fires at 9:45" (CLAUDE.md
# cron-delay section; Runbook Scenario E). Queueing it behind a scheduled run would
# defeat its purpose, and GitHub would silently CANCEL it while pending if a later
# cron entered the group. The cost of the exemption is that a manual dispatch can
# still race a scheduled run — acceptable, because an operator firing it by hand is
# watching, and an emergency lever that can be cancelled is not a lever.
#
# Known trade-off on the scheduled side: GitHub keeps at most ONE pending run per
# group, so a long in-flight run plus a later trigger can lose it. With two daily
# triggers that means a bad day contributes 1 of its 2 expansion batches.
#
# Expansion-sweep budget at two runs/day: 2 x EXPANSION_BATCH_SIZE (75) = 150
# expansion names/day, so the 290-name sweep completes every ~2 days — still inside
# CARRY_FORWARD_MAX_DAYS (5, market_data.py:25), which is the actual staleness
# tolerance for expansion-only names. Core/held/SP500/benchmarks are never batched
# and are re-fetched in full on every run, so the trading-critical set is unaffected.
# If EXPANSION_BATCH_SIZE or the universe size changes, re-check that ~2-day cycle
# against the 5-day tolerance.
# NOTE (Oct 2026): the concurrency group now lives on the `fetch` JOB, not the
# workflow, so an on-demand (push) run's `check` job is never queued behind — and
# never displaces — a pending scheduled run (GitHub keeps one pending run per group,
# so a workflow-level group let a data request cancel a waiting scheduled run and
# then no-op). `check` stands down when a scheduled/manual run is already queued or
# in progress; only then does the request's `fetch` join the group.
jobs:
  check:
    # Decides whether an ON-DEMAND (push) run has anything to do. Scheduled and
    # manual runs always proceed — their behavior is unchanged.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read        # to see whether another market_data run is already active
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      # ref: main, NOT the push SHA: the workflow-level concurrency group can hold
      # this run behind an in-flight scheduled run, and the snapshot that run commits
      # is only visible on the latest main.
      - uses: actions/checkout@v5
        if: github.event_name == 'push'
        with:
          ref: main
      - id: decide
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" != "push" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          TODAY=$(TZ=America/New_York date +%F)
          REQ=$(python3 -c "import json;print(json.load(open('data_request.json')).get('date') or '')" 2>/dev/null || echo "")
          # The gate's exit 11 covers a stale SNAPSHOT, a stale/invalid DOSSIER, or a
          # snapshot under 22 bars deep — all produced by this workflow, so a run is
          # needed whenever ANY of them is not ready (not only a stale snapshot).
          READY=$(python3 - <<'PY' 2>/dev/null || echo "no"
          import json, datetime, zoneinfo
          today = datetime.datetime.now(zoneinfo.ZoneInfo("America/New_York")).strftime("%Y-%m-%d")
          s = json.load(open("market_snapshot.json"))
          d = json.load(open("research_dossier.json"))
          depth = min((len(h) for h in (s.get("history") or {}).values()), default=0)
          bfd = [str(x) for x in (d.get("built_from_days") or [])]
          # Mirrors preflight_gate._dossier_fresh + its snapshot checks exactly, so the
          # job and the gate can never disagree about "ready" (a looser check here would
          # no-op a request while the gate keeps returning 11 all day).
          ok = (s.get("date") == today and depth >= 22
                and d.get("as_of") == today and len(bfd) >= 2
                and max(bfd) == today and bool(d.get("tickers")))
          print("yes" if ok else "no")
          PY
          )
          # Another market_data run already queued/in progress will land the data —
          # stand down rather than compete with (or displace) it. The routine's next
          # hourly attempt re-checks and may re-request.
          ACTIVE=$(gh api "repos/${{ github.repository }}/actions/workflows/market_data.yml/runs?per_page=20" \
                     --jq "[.workflow_runs[] | select(.id != ${{ github.run_id }}) | select(.status==\"queued\" or .status==\"in_progress\" or .status==\"waiting\" or .status==\"pending\")] | length" 2>/dev/null || echo 0)
          echo "today=$TODAY request=$REQ data_ready=$READY other_active_runs=$ACTIVE"
          if [ "$REQ" = "$TODAY" ] && [ "$READY" != "yes" ] && [ "$ACTIVE" = "0" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "On-demand request not needed (request not dated today, data already ready, or another run is active)."
          fi

  fetch:
    needs: check
    if: needs.check.outputs.run == 'true'
    # Serialize fetches (see the long comment above). workflow_dispatch keeps its own
    # per-run group — the manual safety dispatch must never queue or be cancelled.
    concurrency:
      group: market-data-${{ github.event_name == 'workflow_dispatch' && github.run_id || 'scheduled' }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    # Bounded so a wedged run can never hold the concurrency group above for
    # GitHub's 6-hour default. get_extended_history sleeps up to ~90s per ticker on
    # Polygon 429s across a ~400-name sweep, so a stall is realistic — and a stalled
    # run that blocks the 8:00 trigger means no snapshot exists at 9:45, which costs
    # a Wednesday its rebalance (SKIP-RETRY). 50 min clears the observed uncontended
    # range (12-40 min) with headroom; the 40-70 min runs of 2026-08-27/28 were
    # rate-limit contention that serialization removes. NOTE: this cap is also what
    # bounds the Actions-minutes bill per run — see the schedule block above.
    timeout-minutes: 50
    permissions:
      contents: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      # An on-demand (push) run may have waited behind an in-flight run in the
      # concurrency group; build on the LATEST main, not the request commit, or the
      # append-only artifacts are stale and the final push conflicts.
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'push' && 'main' || github.ref }}

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore provider + raw-history cache
        id: cache-restore
        uses: actions/cache/restore@v5
        with:
          # fundamentals_cache.json is deliberately NOT in this list. It's git-tracked
          # (committed below) — a SECOND, independent GH-Actions-private cache copy of
          # it can silently go stale relative to `main` (e.g. after the cloud routine's
          # rare degraded-fallback path commits a fresher one per ROUTINE_DAILY_CYCLE.md)
          # and this restore step runs AFTER checkout, unconditionally overwriting
          # whatever the fresh git checkout just gave it. Before fundamentals_cache.json
          # was committed by this workflow that clobber was harmless (discarded with the
          # ephemeral runner); once it started being committed (2026-08-13 fix below), a
          # stale cache-restore would have silently REVERTED the git-committed data under
          # an innocuous "chore: market snapshot" commit. `actions/checkout` is now this
          # file's single, non-conflicting source of truth — the other three files below
          # have no such git alternative (gitignored), so they still need this cache.
          # Anchored so the save step below (which MUST list the identical paths to
          # round-trip the same cache) can't drift from this list independently.
          path: &cache_paths |
            provider_cache.json
            raw_history_store.json
            fetch_progress.json
          key: fundamentals-v2-${{ runner.os }}-${{ github.run_number }}
          restore-keys: |
            fundamentals-v2-${{ runner.os }}-

      - name: Fetch market snapshot
        env:
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          # Anthropic key for the Step 4 Haiku event digest (GH Actions is the research
          # plane that can reach the Anthropic API). If unset, the digest self-skips.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FULL_REFRESH: ${{ inputs.full_refresh || 'false' }}
          # Stage D switch — set the repo Actions VARIABLE `UNIVERSE_EXPANDED=true`
          # (Settings → Secrets and variables → Actions → Variables) to admit the
          # ~400-name expansion. Also gated in code on fundamental coverage ≥ 80%
          # (universe.get_active_universe) — the flag alone is not sufficient.
          UNIVERSE_EXPANDED: ${{ vars.UNIVERSE_EXPANDED || 'false' }}
          # Phase 5 (Oct 2026) — set the Actions VARIABLE POLYGON_FETCH_MODE=grouped to
          # refresh every stored ticker from ONE grouped-daily call (~38 min → seconds;
          # expansion universe stops rotating). Default per_ticker = unchanged behavior.
          # Owner decision: it changes the data substrate (PLAN_OCT3_REMEDIATION.md §5).
          POLYGON_FETCH_MODE: ${{ vars.POLYGON_FETCH_MODE || 'per_ticker' }}
        run: python fetch_snapshot.py

      - name: Save provider + raw-history cache
        # Explicit save (not the combined actions/cache action's implicit post-save,
        # which the maintainers say "does not work as intended" for this — see
        # https://github.com/actions/cache/tree/main/save#always-save-cache) so the
        # sweep's progress is durable even when the FETCH STEP ABOVE FAILED. Without
        # this, a run that hits fetch_snapshot's depth-abort (sys.exit(1), thrown
        # AFTER the sweep already advanced the expansion cursor + wrote
        # raw_history_store.json to disk) discards that progress instead of
        # persisting it — 2026-08-10/11, 5 straight runs replayed the IDENTICAL
        # cursor=150 batch because none of their in-run progress ever reached the
        # cache, so every run re-hit the same thin ticker from scratch.
        if: always()
        uses: actions/cache/save@v5
        with:
          path: *cache_paths
          key: ${{ steps.cache-restore.outputs.cache-primary-key }}

      - name: Commit market_snapshot.json to repo
        run: |
          git config user.name  "Market Data Bot"
          git config user.email "market-data-bot@users.noreply.github.com"
          # factor_history.jsonl is the full-universe point-in-time factor time
          # series appended by fetch_snapshot.py — it MUST be committed here (GH
          # Actions is the only plane that scores the whole universe daily), or
          # factor-persistence / IC analysis silently loses its substrate (same
          # class as the forecasts.jsonl feed-freeze).
          # forecasts_scored.jsonl + agent_scorecards.json: Stage D moved long-horizon
          # forecast maturation onto this plane (full history lives here) — without
          # committing them, every GH-plane score_matured result is silently lost.
          # fundamentals_cache.json is intentionally TRACKED (.gitignore's own note)
          # and ROUTINE_DAILY_CYCLE.md already commits it from the cloud plane — this
          # workflow modifies it too (fetch_snapshot.py -> get_all_fundamentals) but
          # never staged it, so every run left a permanently dirty tracked file in the
          # checkout. Harmless on its own, but it turned a routine push race into a
          # hard failure the one time `git pull --rebase` below hit a dirty tree
          # (2026-08-13 incident) — committing it here removes the trigger.
          git add market_snapshot.json factor_history.jsonl data_quality_report.json data_quality_history.jsonl research_dossier.json events.jsonl forecasts_scored.jsonl agent_scorecards.json fundamentals_cache.json
          # Only commit if the file actually changed
          git diff --staged --quiet && echo "No changes to commit" || \
            git commit -m "chore: market snapshot [skip ci]"

      - name: Push snapshot
        # Bare `git push` fails with "failed to push some refs" if another workflow
        # (pipeline_digest, the EOD publish, a concurrent market_data retry) lands on
        # main first. Rebase-and-retry so a benign push race doesn't drop the snapshot
        # + factor_history + data_quality artifacts (same durability lesson as the
        # routine STEP 5 push). THREE files in the whitelist above have a second
        # independent committer — the cloud routine stages fundamentals_cache.json,
        # forecasts_scored.jsonl AND agent_scorecards.json (ROUTINE_DAILY_CYCLE.md:280/407),
        # not just the first. The `concurrency` group at the top of this file serializes
        # runs of THIS workflow against each other, but it cannot serialize against the
        # cloud plane, so that cross-plane race survives it — and serialization pushes
        # runs later into the day, nearer the routine. A genuine content conflict there
        # is low-probability and, if it fires, fails this attempt cleanly (see the
        # explicit error messages below); it does not corrupt anything, since a fresh
        # `actions/checkout` on the next scheduled run is unaffected by this run's
        # conflicted state.
        run: |
          for i in 1 2 3; do
            git push && exit 0
            echo "push rejected (attempt $i) — rebasing on origin/main and retrying"
            # `git pull --rebase` refuses to run against a dirty working tree — a
            # 2026-08-13 incident hit exactly this (fundamentals_cache.json modified
            # but not yet committed) and turned a benign, self-healing push race into
            # a hard run failure. That specific trigger is fixed above (the commit
            # step now stages fundamentals_cache.json, and market_data.py's write is
            # now conditional so most runs never even dirty it), but stash-and-restore
            # around the rebase here too, so ANY future stray local diff can't
            # reintroduce the same failure mode. `git stash push -u` is a safe no-op
            # ("No local changes to save") when the tree is already clean, so this
            # never fires spuriously on the common path.
            before=$(git stash list | wc -l)
            git stash push -u -m "push-retry-$i"
            after=$(git stash list | wc -l)
            if ! git pull --rebase origin main; then
              echo "::error::rebase failed (likely a real content conflict, not just a dirty tree) — aborting so the next scheduled run starts clean"
              git rebase --abort 2>/dev/null || true
              exit 1
            fi
            if [ "$after" -gt "$before" ]; then
              # An explicit failure message here, not a silent abort under bash's
              # default -e: a pop conflict means the rebase changed the same lines
              # the stash holds (e.g. two planes both touching fundamentals_cache.json
              # — a known, low-probability, and safely-recoverable residual risk: this
              # run's push simply fails clean, and the NEXT run starts from a fresh
              # `actions/checkout`, unaffected by this runner's conflicted state).
              git stash pop || { echo "::error::stash pop conflicted after rebase — this run's push is abandoned; the next scheduled run starts from a clean checkout"; exit 1; }
            fi
          done
          git push
